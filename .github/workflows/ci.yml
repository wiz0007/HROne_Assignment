name: CI Pipeline - Employee Attendance & Analytics API

on:
  push:
    branches:
      - master
      - main
      - 'sprint-*'
  pull_request:
    branches:
      - master
      - main
      - 'sprint-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Test & Quality Checks
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: ci_test_db
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Verify MongoDB Service Readiness
        run: |
          echo "Waiting for MongoDB service to accept connections on port 27017..."
          for i in {1..30}; do
            if nc -z localhost 27017; then
              echo "MongoDB is up and accepting connections!"
              exit 0
            fi
            sleep 1
          done
          echo "Error: MongoDB did not start within 30 seconds"
          exit 1

      - name: Bytecode & Syntax Compilation Check
        run: |
          python -m compileall -q app tests

      - name: Code Quality & Lint Checks (Flake8)
        run: |
          # Stop the build if there are Python syntax errors, undefined names, or unused imports
          flake8 app tests --count --select=E9,F63,F7,F82,F401 --show-source --statistics

      - name: Run Automated Test Suite (All Sprints)
        run: |
          python -m pytest -v

      - name: API Startup & Health Endpoint Smoke Test
        run: |
          echo "Starting API server in background..."
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          
          # Wait up to 15 seconds for FastAPI to boot and connect to MongoDB
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy and MongoDB connectivity verified (HTTP 200)!"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          
          echo "Error: API health check did not return HTTP 200"
          kill $SERVER_PID || true
          exit 1
